[project]
name = "purrge"
version = "0.3.0"
description = "keeps your pc awake and periodically purges junk"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "psutil>=6.0",
    "pystray>=0.19; sys_platform == 'win32'",
    "pillow>=10.0; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pyinstaller>=6.0"]

[project.scripts]
purrge = "purrge.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["purrge*"]
